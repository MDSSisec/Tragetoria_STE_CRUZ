<title>Trajetórias Santa Cruz</title>
<style>

  .table-wrap { overflow-x: auto; }

  .summary-grid {

  }

  /* ---------- timeline ---------- */
  .timeline-scroll { overflow-x: auto; padding: 6px 24px 24px; }
  .timeline-svg-wrap { min-width: 720px; }
  .vinculo-bar { cursor: pointer; }
  .vinculo-bar rect.fill { fill: var(--accent); opacity: 0.16; }

  .modal-overlay {

  .modal {

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }

  @media (max-width: 520px) { .field-grid { grid-template-columns: 1fr; } .field:nth-of-type(odd) { border-right: none; } }

  details.meta-accordion { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  details.meta-accordion summary {
    padding: 10px 14px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink-2); list-style: none;

  details.meta-accordion summary::-webkit-details-marker { display: none; }

  .note-box {

    display: flex; gap: 8px; align-items: flex-start;
  }
  .note-box svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; color: var(--ink-muted); }

  .raw-event-row:hover { border-color: var(--ink-muted); background: var(--surface-2); }

  .raw-event-row .re-tipo { flex: 1; color: var(--ink); }
  .raw-event-row .re-dup { color: var(--warning); font-size: 11px; font-weight: 700; }

  footer.app-footer { text-align: center; padding: 28px 24px 40px; color: var(--ink-muted); font-size: 12px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<script>
(function () {
  "use strict";

  /* ================= DATA ================= */

  /* ================= HELPERS ================= */
  function esc(s) {
    if (s === null || s === undefined) return "";

      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

      if (/^\d/.test(w)) return w;

    }).join(" ");
  }

    if (anos) parts.push(anos + (anos === 1 ? " ano" : " anos"));

  }

    chevronRight: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/></svg>',

  };

  // "pessoa" dims live on every person regardless of whether they ever had a CAGED occurrence

  var FILTER_DIMS = [

  /* ================= STATE ================= */

  };

  function filterKeyForOcc(dim, o) { return dim === "cnpjRaizFiltro" ? o.cnpjRaiz : o[dim]; }

  // matches a real CAGED occurrence against período + the occurrence-level dims
  function occMatchesOccLevelFilters(o) {
    var f = state.filters;
    if (f.periodoStart !== null && o.competenciaIdx < f.periodoStart) return false;
    if (f.periodoEnd !== null && o.competenciaIdx > f.periodoEnd) return false;

  }
  // matches a person against pessoa-level dims + the "situação no CAGED" toggle
  function pessoaMatchesPessoaLevelFilters(p) {

    for (var i = 0; i < PESSOA_DIMS.length; i++) {
      var dim = PESSOA_DIMS[i];
      var set = f[dim.key];

      } else if (!set.has(p[dim.key])) return false;

  }
  function occLevelFiltersActive() {

    if (f.periodoStart !== null || f.periodoEnd !== null) return true;
    return OCC_DIMS.some(function (d) { return f[d.key].size > 0; });
  }
  function hasActiveFilters() {
    var f = state.filters;
    if (f.periodoStart !== null || f.periodoEnd !== null) return true;
    if (f.situacaoCaged !== "todas") return true;
    if (f.cadUnico !== "todas") return true;
    return FILTER_DIMS.some(function (d) { return f[d.key].size > 0; });
  }
  function activeFilterCount() {
    var f = state.filters;
    var n = FILTER_DIMS.reduce(function (acc, d) { return acc + f[d.key].size; }, 0);
    if (f.periodoStart !== null || f.periodoEnd !== null) n += 1;
    if (f.situacaoCaged !== "todas") n += 1;
    if (f.cadUnico !== "todas") n += 1;
    return n;
  }

  function computeKpis(filteredOcc) {
    var cpfSet = new Set(filteredOcc.map(function (o) { return o.cpf; }));

    var empresas = new Set(filteredOcc.map(function (o) { return o.cnpjRaiz; }));

    return {
      totalOcorrencias: filteredOcc.length,
      totalAdmissoes: admissoes,
      totalDesligamentos: filteredOcc.length - admissoes,

  }

  // returns the visible pessoas AND the real occurrences that belong to them and match

    var matchingOccCpf = null;
    if (occActive) {
      matchingOccCpf = new Set(ocorrencias.filter(occMatchesOccLevelFilters).map(function (o) { return o.cpf; }));
    }
    var list = pessoas.filter(function (p) {
      if (!pessoaMatchesPessoaLevelFilters(p)) return false;
      if (occActive && !matchingOccCpf.has(p.cpf)) return false;
      return true;
    });
    var scopeCpf = new Set(list.map(function (p) { return p.cpf; }));
    var filteredOcc = ocorrencias.filter(function (o) { return scopeCpf.has(o.cpf) && occMatchesOccLevelFilters(o); });
    return { pessoasInScope: list, filteredOcc: filteredOcc };
  }

  function getVisiblePessoas(list) {
    var q = state.search.trim().toLowerCase();
    if (q) {
      var qDigits = q.replace(/\D/g, "");
      list = list.filter(function (p) {
        return p.nome.toLowerCase().indexOf(q) !== -1 ||
          p.cpfFormatado.indexOf(q) !== -1 ||
          (qDigits && p.cpf.indexOf(qDigits) !== -1);
      });
    }
    var field = state.sort.field, dir = state.sort.dir === "asc" ? 1 : -1;
    list = list.slice().sort(function (a, b) {
      var sa = personStats.get(a.cpf), sb = personStats.get(b.cpf);
      var va, vb;
      switch (field) {
        case "cpf": va = a.cpf; vb = b.cpf; break;
        case "uf": va = a.uf + a.municipio; vb = b.uf + b.municipio; break;
        case "vinculos": va = sa.nVinculos; vb = sb.nVinculos; break;
        case "empresas": va = sa.nEmpresas; vb = sb.nEmpresas; break;
        case "situacao": va = sa.situacaoAtual; vb = sb.situacaoAtual; break;
        case "ultima": va = sa.ultimo ? sa.ultimo.competenciaIdx : -1; vb = sb.ultimo ? sb.ultimo.competenciaIdx : -1; break;
        default: va = a.nome; vb = b.nome;
      }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return a.nome < b.nome ? -1 : 1;
    });
    return list;
  }

  /* ================= RENDER: SHELL ================= */
  var app = document.getElementById("app");

  function render() {
    var html = renderTopbar() + '<main>' + (state.view === "overview" ? renderOverview() : renderPersonView(state.selectedCpf)) + "</main>" + renderFooter();
    if (state.modal) html += renderModal();
    app.innerHTML = html;
  }

  function renderTopbar() {
    var crumbs = '<button data-action="go-overview" class="' + (state.view === "overview" ? "" : "") + '">Painel</button>';
    if (state.view === "pessoa") {
      var p = pessoaByCpf.get(state.selectedCpf);
      crumbs += '<span>' + ICONS.arrow.replace('viewBox="0 0 20 20"', 'viewBox="0 0 20 20" style="width:11px;height:11px;opacity:.5"') + '</span>' +
        '<span class="crumb-current">' + esc(titleCasePt(p.nome)) + '</span>';
    }
    return '' +
      '<div class="topbar"><div class="topbar-inner">' +
      '<div class="brand">' +
      '<div class="brand-mark"><svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 15l4.2-5 3.4 3L16.5 6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 6H16.5V10" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
      '<div><div class="brand-name">Trajetórias Santa Cruz</div><div class="brand-sub">Egressos dos cursos profissionalizantes &middot; cruzamento com o CAGED</div></div>' +
      '</div>' +
      '<nav class="breadcrumbs">' + crumbs + '</nav>' +
      '</div></div>';
  }

  function renderFooter() {
    return '<footer class="app-footer">Base: Associação União Santa Cruz &middot; ocorrências CAGED ' +
      competenciaLabelFromIdx(GLOBAL_MIN_IDX) + '–' + competenciaLabelFromIdx(GLOBAL_MAX_IDX) +
      ' &middot; ' + fmtInt(ocorrencias.length) + ' registros originais, nenhum descartado.</footer>';
  }

  /* ================= RENDER: OVERVIEW ================= */
  function renderOverview() {
    var scope = getVisibleScope();
    var kpis = computeKpis(scope.filteredOcc);
    var visiblePessoas = getVisiblePessoas(scope.pessoasInScope);

    var totalPages = Math.max(1, Math.ceil(visiblePessoas.length / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    var start = (state.page - 1) * state.pageSize;
    var pagePessoas = visiblePessoas.slice(start, start + state.pageSize);

    var totalPessoasScope = scope.pessoasInScope.length;
    var comOcorrencia = scope.pessoasInScope.filter(function (p) { return p.temOcorrencia; }).length;
    var pctComOcorrencia = totalPessoasScope ? Math.round((comOcorrencia / totalPessoasScope) * 100) : 0;

    var kpiDefs = [
      ["Pessoas", totalPessoasScope, comOcorrencia + " com vínculo encontrado (" + pctComOcorrencia + "%)"],
      ["Ocorrências", kpis.totalOcorrencias],
      ["Admissões", kpis.totalAdmissoes],
      ["Desligamentos", kpis.totalDesligamentos],
      ["Empresas", kpis.totalEmpresas],
      ["Áreas de atuação", kpis.totalAreas]
    ];
    var kpiHtml = kpiDefs.map(function (k) {
      return '<div class="kpi-tile"><div class="kpi-label">' + k[0] + '</div><div class="kpi-value tabular">' + fmtInt(k[1]) + "</div>" +
        (k[2] ? '<div class="kpi-sub">' + k[2] + "</div>" : "") + "</div>";
    }).join("");

    return '' +
      '<div class="container">' +
      '<div class="kpi-row">' + kpiHtml + "</div>" +
      (hasActiveFilters() || state.search
        ? '<div class="scope-note">' + ICONS.info + ' Indicadores calculados sobre <strong>' + (hasActiveFilters() ? "o recorte filtrado" : "todas as ocorrências") + '</strong>' + (state.search ? "; a busca por nome/CPF afeta apenas a lista abaixo." : ".") + "</div>"
        : '<div class="scope-note">' + ICONS.info + " Indicadores sobre a base completa: 386 pessoas cruzadas com o CAGED, das quais 180 tiveram algum vínculo encontrado. Use os filtros para recortar por período, local, setor, empresa, curso, tipo de movimentação ou situação no CAGED.</div>") +
      '<div class="panel">' +
      renderToolbar() +
      renderTable(pagePessoas) +
      renderTableFooter(visiblePessoas.length, totalPages, start, pagePessoas.length) +
      "</div>" +
      "</div>";
  }

  function renderToolbar() {
    var html = '<div class="toolbar">';
    html += '<div class="search-row">';
    html += '<div class="search-box">' + ICONS.search + '<input type="text" data-role="search" placeholder="Pesquisar por nome ou CPF" value="' + esc(state.search) + '" /></div>';
    html += '<button class="btn' + (state.filtersExpanded ? " btn-accent" : "") + '" data-action="toggle-filters">' + ICONS.filter + " Filtros" + (activeFilterCount() ? '<span class="count-pill">' + activeFilterCount() + "</span>" : "") + "</button>";
    if (hasActiveFilters() || state.search) html += '<button class="btn btn-ghost" data-action="clear-all">Limpar tudo</button>';
    html += "</div>";

    if (state.filtersExpanded) {
      html += '<div class="filters-grid">';
      html += renderPeriodoFilter();
      html += renderSituacaoCagedFilter();
      html += renderCadUnicoFilter();
      FILTER_DIMS.forEach(function (d) { html += renderMsFilter(d); });
      html += "</div>";
    }

    var chips = renderActiveChips();
    if (chips) html += '<div class="active-filters">' + chips + "</div>";
    html += "</div>";
    return html;
  }

  function competenciaOptions() {
    return opcoes.competencias.slice().sort(function (a, b) { return a - b; });
  }
  function competenciaToIdx(c) { return Math.floor(c / 100) * 12 + (c % 100); }

  function renderPeriodoFilter() {
    var comps = competenciaOptions();
    function opts(selected) {
      return '<option value="">—</option>' + comps.map(function (c) {
        var idx = competenciaToIdx(c);
        return '<option value="' + idx + '"' + (selected === idx ? " selected" : "") + '>' + competenciaLabelFromIdx(idx) + "</option>";
      }).join("");
    }
    return '' +
      '<div class="filter-field"><label>Período — de</label><select data-role="periodo-start">' + opts(state.filters.periodoStart) + '</select></div>' +
      '<div class="filter-field"><label>Período — até</label><select data-role="periodo-end">' + opts(state.filters.periodoEnd) + '</select></div>';
  }

  function renderSituacaoCagedFilter() {
    var v = state.filters.situacaoCaged;
    function opt(val, label) { return '<option value="' + val + '"' + (v === val ? " selected" : "") + ">" + label + "</option>"; }
    return '<div class="filter-field"><label>Situação no CAGED</label><select data-role="situacao-caged">' +
      opt("todas", "Todas") + opt("com", "Com vínculo encontrado") + opt("sem", "Sem vínculo encontrado") +
      "</select></div>";
  }

  function renderCadUnicoFilter() {
    var v = state.filters.cadUnico;
    function opt(val, label) { return '<option value="' + val + '"' + (v === val ? " selected" : "") + ">" + label + "</option>"; }
    return '<div class="filter-field"><label>CadÚnico</label><select data-role="cadunico">' +
      opt("todas", "Todas") + opt("sim", "CadÚnico ativo") + opt("nao", "CadÚnico não ativo") +
      "</select></div>";
  }

  function renderMsFilter(dim) {
    var set = state.filters[dim.key];
    var isOpen = state.openMsFilter === dim.key;
    var triggerText = set.size === 0 ? '<span class="ph">Todas</span>' : set.size + " selecionada" + (set.size > 1 ? "s" : "");
    var html = '<div class="filter-field" data-dim="' + dim.key + '"><label>' + esc(dim.label) + "</label>";
    html += '<button type="button" class="ms-trigger" data-action="ms-toggle" data-dim="' + dim.key + '">' + triggerText + '<span style="opacity:.5">▾</span></button>';
    if (isOpen) {
      html += '<div class="ms-panel">';
      html += dim.options.map(function (opt) {
        var checked = set.has(opt);
        var label = dim.titleCase ? titleCasePt(opt) : opt;
        return '<label class="ms-option"><input type="checkbox" data-role="ms-option" data-dim="' + dim.key + '" value="' + esc(opt) + '" ' + (checked ? "checked" : "") + " /> " + esc(label) + "</label>";
      }).join("");
      html += "</div>";
    }
    html += "</div>";
    return html;
  }

  function renderActiveChips() {
    var chips = [];
    var f = state.filters;
    if (f.periodoStart !== null || f.periodoEnd !== null) {
      var txt = (f.periodoStart !== null ? competenciaLabelFromIdx(f.periodoStart) : "início") + " – " + (f.periodoEnd !== null ? competenciaLabelFromIdx(f.periodoEnd) : "fim");
      chips.push(chipHtml("Período: " + txt, "periodo", ""));
    }
    if (f.situacaoCaged !== "todas") {
      chips.push(chipHtml("Situação no CAGED: " + (f.situacaoCaged === "com" ? "com vínculo encontrado" : "sem vínculo encontrado"), "situacaoCaged", ""));
    }
    if (f.cadUnico !== "todas") {
      chips.push(chipHtml("CadÚnico: " + (f.cadUnico === "sim" ? "ativo" : "não ativo"), "cadUnico", ""));
    }
    FILTER_DIMS.forEach(function (d) {
      f[d.key].forEach(function (v) {
        var label = d.titleCase ? titleCasePt(v) : v;
        chips.push(chipHtml(d.label + ": " + label, d.key, v));
      });
    });
    return chips.join("");
  }
  function chipHtml(text, dim, value) {
    return '<span class="chip">' + esc(text) + '<button type="button" data-action="remove-filter" data-dim="' + dim + '" data-value="' + esc(value) + '">' + ICONS.x + "</button></span>";
  }

  function renderTable(rows) {
    var cols = [
      ["nome", "Nome"], ["cpf", "CPF"], ["uf", "Cidade / UF"], ["vinculos", "Vínculos"], ["empresas", "Empresas"], ["situacao", "Situação atual"], ["ultima", "Última ocorrência"]
    ];
    var head = cols.map(function (c) {
      var active = state.sort.field === c[0];
      var arrow = active ? (state.sort.dir === "asc" ? "↑" : "↓") : "↕";
      return '<th data-action="sort" data-field="' + c[0] + '" class="' + (active ? "active" : "") + '">' + c[1] + ' <span class="sort-arrow">' + arrow + "</span></th>";
    }).join("");

    if (!rows.length) {
      return '<div class="table-wrap"><table><thead><tr>' + head + "</tr></thead></table></div>" +
        '<div class="row-empty-state">Nenhuma pessoa encontrada com os filtros e a busca atuais.</div>';
    }

    var body = rows.map(function (p) {
      var s = personStats.get(p.cpf);
      var sitBadge;
      if (s.situacaoAtual === "aberto") {
        sitBadge = '<span class="badge badge-good"><span class="badge-dot" style="background:var(--good)"></span>Vínculo em aberto</span>';
      } else if (s.situacaoAtual === "encerrado") {
        sitBadge = '<span class="badge badge-neutral"><span class="badge-dot" style="background:var(--ink-muted)"></span>Sem vínculo aberto</span>';
      } else {
        sitBadge = '<span class="badge badge-warning"><span class="badge-dot" style="background:var(--warning)"></span>Sem vínculo encontrado</span>';
      }
      var ultimaCell = s.ultimo
        ? '<td class="mono">' + s.ultimo.competenciaLabel + '<div class="cell-sub">' + (s.ultimo.movimento === "admissao" ? "Admissão" : "Desligamento") + "</div></td>"
        : '<td class="mono" style="color:var(--ink-muted)">—</td>';
      return '<tr data-action="open-pessoa" data-cpf="' + p.cpf + '">' +
        '<td><div class="cell-name">' + esc(titleCasePt(p.nome)) + "</div></td>" +
        '<td class="mono">' + p.cpfFormatado + "</td>" +
        '<td>' + esc(titleCasePt(p.municipio)) + '<div class="cell-sub">' + p.uf + "</div></td>" +
        '<td class="tabular">' + s.nVinculos + "</td>" +
        '<td class="tabular">' + s.nEmpresas + "</td>" +
        "<td>" + sitBadge + "</td>" +
        ultimaCell +
        "</tr>";
    }).join("");

    return '<div class="table-wrap"><table><thead><tr>' + head + "</tr></thead><tbody>" + body + "</tbody></table></div>";
  }

  function renderTableFooter(total, totalPages, start, shown) {
    if (!total) return "";
    var page = state.page;
    var buttons = "";
    var windowSize = 5;
    var from = Math.max(1, page - Math.floor(windowSize / 2));
    var to = Math.min(totalPages, from + windowSize - 1);
    from = Math.max(1, to - windowSize + 1);
    buttons += '<button data-action="page-goto" data-page="' + (page - 1) + '" ' + (page === 1 ? "disabled" : "") + ">" + ICONS.chevronLeft + "</button>";
    for (var i = from; i <= to; i++) {
      buttons += '<button data-action="page-goto" data-page="' + i + '" class="' + (i === page ? "current" : "") + '">' + i + "</button>";
    }
    buttons += '<button data-action="page-goto" data-page="' + (page + 1) + '" ' + (page === totalPages ? "disabled" : "") + ">" + ICONS.chevronRight + "</button>";

    return '<div class="table-footer">' +
      '<div>Mostrando ' + (start + 1) + "–" + (start + shown) + " de " + fmtInt(total) + " pessoas</div>" +
      '<div class="pager">' + buttons + "</div>" +
      '<div class="pagesize">Por página: <select data-role="pagesize">' +
      [10, 20, 50, 100].map(function (n) { return '<option value="' + n + '" ' + (state.pageSize === n ? "selected" : "") + ">" + n + "</option>"; }).join("") +
      "</select></div>" +
      "</div>";
  }

  /* ================= RENDER: PESSOA ================= */
  function renderPersonView(cpf) {
    var p = pessoaByCpf.get(cpf);
    var s = personStats.get(cpf);
    var vins = (vinculosByCpf.get(cpf) || []).slice().sort(function (a, b) {
      var sa = a.admissaoCompetenciaIdx !== null ? a.admissaoCompetenciaIdx : (a.desligamentoCompetenciaIdx - 0.5);
      var sb = b.admissaoCompetenciaIdx !== null ? b.admissaoCompetenciaIdx : (b.desligamentoCompetenciaIdx - 0.5);
      return sa - sb;
    });

    var totalSpanMeses = s.primeiro && s.ultimo ? (s.ultimo.competenciaIdx - s.primeiro.competenciaIdx) : null;
    var duracoesFechadas = vins.filter(function (v) { return v.duracaoMeses !== null; }).map(function (v) { return v.duracaoMeses; });
    var mediaPermanencia = duracoesFechadas.length ? Math.round(duracoesFechadas.reduce(function (a, b) { return a + b; }, 0) / duracoesFechadas.length) : null;

    var cursosHtml = p.cursos.map(function (c) { return '<span class="course-chip">' + esc(titleCasePt(c.curso)) + "</span>"; }).join("");

    var summaryTiles = [
      ["Primeiro registro", s.primeiro ? s.primeiro.competenciaLabel + " · " + (s.primeiro.movimento === "admissao" ? "admissão" : "desligamento") : "—"],
      ["Registro mais recente", s.ultimo ? s.ultimo.competenciaLabel + " · " + (s.ultimo.movimento === "admissao" ? "admissão" : "desligamento") : "—"],
      ["Vínculos identificados", s.nVinculos],
      ["Empresas distintas", s.nEmpresas],
      ["Setores distintos", s.nAreas],
      ["Permanência média (vínculos encerrados)", mediaPermanencia !== null ? monthsToText(mediaPermanencia) : "não calculável"],
      ["Intervalo coberto na base", totalSpanMeses !== null ? monthsToText(totalSpanMeses) : "—"]
    ];
    var summaryHtml = summaryTiles.map(function (t) {
      return '<div class="summary-tile"><div class="kpi-label">' + t[0] + '</div><div class="kpi-value-sm">' + t[1] + "</div></div>";
    }).join("");

    var evolucaoHtml = renderEvolucaoSetores(vins);

    return '<div class="container">' +
      '<div class="panel">' +
      '<div class="person-header">' +
      '<div class="person-id"><h1>' + esc(titleCasePt(p.nome)) + "</h1>" +
      '<div class="person-meta">' +
      '<span class="mono">CPF ' + p.cpfFormatado + "</span>" +
      '<span class="sep">&middot;</span><span>' + esc(titleCasePt(p.municipio)) + " / " + p.uf + "</span>" +
      '<span class="sep">&middot;</span><span>CadÚnico: ' + (p.cadUnicoAtivo === "SIM" ? "ativo" : "não ativo") + "</span>" +
      "</div>" +
      (cursosHtml ? '<div class="courses-row">' + cursosHtml + "</div>" : "") +
      renderPresencaPorAno(p.presencaPorAno) +
      "</div>" +
      '<button class="btn btn-ghost" data-action="go-overview">' + ICONS.chevronLeft + " Voltar à lista</button>" +
      "</div>" +
      '<div class="summary-grid">' + summaryHtml + "</div>" +

      '<div class="section-heading"><h2>Linha do tempo profissional</h2><span class="section-note">Vínculos inferidos a partir do pareamento cronológico de admissões e desligamentos por empregador &middot; clique numa ocorrência para ver o registro completo</span></div>' +
      renderTimeline(vins) +

      (evolucaoHtml ? '<div class="section-heading"><h2>Evolução de setores ao longo do tempo</h2><span class="section-note">Não há cargo/função individual registrado nesta base — apenas o setor econômico do empregador em cada vínculo</span></div>' + evolucaoHtml : "") +

      "</div>" +
      "</div>";
  }

  function renderPresencaPorAno(presenca) {
    if (!presenca || !presenca.length) return "";
    var items = presenca.map(function (a) {
      return '<span class="badge ' + (a.comMovimento ? "badge-good" : "badge-neutral") + '" title="' + (a.comMovimento ? "Movimentação CAGED encontrada em " + a.ano : "Nenhuma movimentação CAGED encontrada em " + a.ano) + '">' +
        '<span class="badge-dot" style="background:' + (a.comMovimento ? "var(--good)" : "var(--ink-muted)") + '"></span>' + a.ano + "</span>";
    }).join("");
    return '<div style="margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;">' +
      '<span style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:600;margin-right:2px;">Presença no CAGED</span>' + items + "</div>";
  }

  function renderEvolucaoSetores(vins) {
    var ordered = vins.filter(function (v) { return v.secao; });
    if (!ordered.length) return "";
    var seq = [];
    ordered.forEach(function (v) {
      var label = titleCasePt(v.secao);
      if (seq.length === 0 || seq[seq.length - 1] !== label) seq.push(label);
    });
    return '<div style="padding:4px 24px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;">' +
      seq.map(function (s, i) {
        return (i > 0 ? '<span style="color:var(--ink-muted);opacity:.6">' + ICONS.arrow.replace('viewBox="0 0 20 20"', 'viewBox="0 0 20 20" style="width:13px;height:13px;vertical-align:-2px"') + "</span>" : "") +
          '<span class="course-chip" style="background:var(--surface);border-color:var(--line-strong);font-weight:600;color:var(--ink-2)">' + esc(s) + "</span>";
      }).join("") +
      "</div>";
  }

  /* ================= RENDER: TIMELINE ================= */
  function renderTimeline(vins) {
    if (!vins.length) return '<div class="empty-timeline">Nenhum vínculo identificado para esta pessoa no período coberto pela base.</div>';

    var domainStart = GLOBAL_MIN_IDX, domainEnd = GLOBAL_MAX_IDX;
    var pxPerMonth = 11;
    var marginX = 46, marginTop = 28, rowH = 62;

    var laned = assignLanes(vins, domainStart, domainEnd);
    var lanes = 1 + Math.max.apply(null, laned.map(function (v) { return v.lane; }));

    // for label truncation: figure out how much horizontal room each bar has before the next bar in its own lane begins
    var byLane = new Map();
    laned.forEach(function (v) { if (!byLane.has(v.lane)) byLane.set(v.lane, []); byLane.get(v.lane).push(v); });
    byLane.forEach(function (arr) {
      arr.sort(function (a, b) { return a.start - b.start; });
      arr.forEach(function (v, i) { v.labelLimitIdx = i + 1 < arr.length ? arr[i + 1].start : domainEnd; });
    });
    var width = marginX * 2 + (domainEnd - domainStart) * pxPerMonth;
    var height = marginTop + lanes * rowH + 16;

    function x(idx) { return marginX + (idx - domainStart) * pxPerMonth; }

    // year ticks
    var ticks = "";
    var firstYear = Math.floor((domainStart - 1) / 12);
    var lastYear = Math.floor((domainEnd - 1) / 12);
    for (var y = firstYear; y <= lastYear; y++) {
      var idx = y * 12 + 1;
      if (idx < domainStart || idx > domainEnd) continue;
      var xp = x(idx);
      ticks += '<g class="axis-tick"><line x1="' + xp + '" y1="' + marginTop + '" x2="' + xp + '" y2="' + (height - 10) + '" /><text x="' + xp + '" y="18" text-anchor="middle">' + y + "</text></g>";
    }
    var todayX = x(domainEnd);
    ticks += '<line class="today-line" x1="' + todayX + '" y1="' + marginTop + '" x2="' + todayX + '" y2="' + (height - 10) + '" />' +
      '<text class="today-label" x="' + (todayX - 6) + '" y="' + (height - 2) + '" text-anchor="end">base até ' + competenciaLabelFromIdx(domainEnd) + "</text>";

    var bars = laned.map(function (v) {
      var y = marginTop + v.lane * rowH + rowH / 2;
      var x1 = x(v.start), x2 = x(v.end);
      var isOpen = v.status === "aberto";
      var unknownStart = v.admissaoForaDaBase;
      var barW = Math.max(2, x2 - x1);

      var spineCls = "spine" + (isOpen ? " open" : "") + (unknownStart ? " unknown-start" : "");
      var fillCls = "fill" + (isOpen ? " open" : "");

      var startNode = unknownStart
        ? '<circle class="node-unknown" cx="' + x1 + '" cy="' + y + '" r="4.5" stroke="var(--good)" />'
        : '<circle class="node-start" cx="' + x1 + '" cy="' + y + '" r="4.5" />';
      var endNode = isOpen
        ? '<circle class="node-unknown" cx="' + x2 + '" cy="' + y + '" r="4.5" stroke="var(--critical)" />'
        : '<circle class="node-end" cx="' + x2 + '" cy="' + y + '" r="4.5" />';

      var labelRoomPx = Math.max(barW, x(v.labelLimitIdx) - x1 - 8);
      var empLabel = "CNPJ " + v.cnpjRaiz + (v.secao ? " · " + titleCasePt(v.secao) : "");
      var maxChars = Math.max(0, Math.floor(labelRoomPx / 6.3));
      if (empLabel.length > maxChars) empLabel = maxChars > 1 ? empLabel.slice(0, maxChars - 1) + "…" : "";
      var dateLabel = (unknownStart ? "admissão não registrada" : v.admissaoLabel) + " – " + (isOpen ? "em aberto" : v.desligamentoLabel);
      var showEmpLabel = labelRoomPx >= 44 && empLabel;
      var showDateLabel = labelRoomPx >= 92;
      if (dateLabel.length * 5.7 > labelRoomPx && labelRoomPx < 160) showDateLabel = false;

      var titleText = "Empresa (CNPJ raiz): " + v.cnpjRaiz + "\nSetor: " + titleCasePt(v.secao || "não informado") +
        "\nAdmissão: " + (unknownStart ? "não registrada nesta base" : v.admissaoLabel) +
        "\nDesligamento: " + (isOpen ? "sem registro até " + competenciaLabelFromIdx(domainEnd) : v.desligamentoLabel) +
        (v.duracaoMeses !== null ? "\nDuração: " + monthsToText(v.duracaoMeses) : "");

      return '<g class="vinculo-bar" data-action="open-vinculo" data-id="' + v.id + '" tabindex="0" role="button" aria-label="Vínculo em CNPJ ' + v.cnpjRaiz + '">' +
        "<title>" + esc(titleText) + "</title>" +
        '<rect x="' + (x1 - 6) + '" y="' + (y - 13) + '" width="' + (barW + 12) + '" height="26" fill="rgba(0,0,0,0.001)" style="pointer-events:all" />' +
        '<rect class="fill ' + fillCls + '" x="' + x1 + '" y="' + (y - 9) + '" width="' + barW + '" height="18" rx="9" />' +
        '<line class="' + spineCls + '" x1="' + x1 + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '" />' +
        startNode + endNode +
        (showEmpLabel ? '<text class="vinculo-label-emp" x="' + x1 + '" y="' + (y + 24) + '">' + esc(empLabel) + "</text>" : "") +
        (showDateLabel ? '<text class="vinculo-label-sec" x="' + x1 + '" y="' + (y + 36) + '">' + esc(dateLabel) + "</text>" : "") +
        "</g>";
    }).join("");

    var svg = '<svg class="timeline-svg" width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + " " + height + '" role="img" aria-label="Linha do tempo profissional">' + ticks + bars + "</svg>";

    var legend = '<div class="timeline-legend">' +
      '<span class="item"><span class="swatch" style="background:var(--good)"></span>Início de vínculo confirmado</span>' +
      '<span class="item"><span class="swatch" style="background:var(--critical)"></span>Fim de vínculo confirmado</span>' +
      '<span class="item"><span class="swatch" style="background:var(--surface);border:2px dashed var(--ink-muted)"></span>Data não registrada na base</span>' +
      '<span class="item"><span class="swatch" style="background:var(--good);opacity:.4"></span>Vínculo em aberto (sem desligamento registrado)</span>' +
      "</div>";

    return '<div class="timeline-scroll"><div class="timeline-svg-wrap">' + svg + "</div></div>" + legend;
  }

  var LEAD_IN_MONTHS = 6; // visual-only lead-in for vínculos whose real start is unknown (before the data window)

  function assignLanes(vins, domainStart, domainEnd) {
    var withRange = vins.map(function (v) {
      var end = v.desligamentoCompetenciaIdx !== null ? v.desligamentoCompetenciaIdx : domainEnd;
      var start = v.admissaoCompetenciaIdx !== null
        ? v.admissaoCompetenciaIdx
        : Math.max(domainStart, end - LEAD_IN_MONTHS);
      return Object.assign({}, v, { start: start, end: end });
    }).sort(function (a, b) { return a.start - b.start || a.end - b.end; });
    var laneEnds = [];
    var MIN_GAP = 1; // months of breathing room before a lane is reused, so touching/overlapping vínculos never silently stack
    withRange.forEach(function (v) {
      var lane = -1;
      for (var i = 0; i < laneEnds.length; i++) { if (laneEnds[i] + MIN_GAP <= v.start) { lane = i; break; } }
      if (lane === -1) { lane = laneEnds.length; laneEnds.push(v.end); } else { laneEnds[lane] = Math.max(laneEnds[lane], v.end); }
      v.lane = lane;
    });
    return withRange;
  }

  /* ================= RENDER: MODAL ================= */
  function renderModal() {
    if (!state.modal) return "";
    var v = vinculoById.get(state.modal.id);
    if (!v) return "";
    var p = pessoaByCpf.get(v.cpf);
    var admOcc = v.admissaoOcorrenciaId !== null ? ocorrenciaById.get(v.admissaoOcorrenciaId) : null;
    var desOcc = v.desligamentoOcorrenciaId !== null ? ocorrenciaById.get(v.desligamentoOcorrenciaId) : null;
    var metaSrc = (admOcc || desOcc).meta;

    var note = "";
    if (v.admissaoForaDaBase) {
      note = "A admissão deste vínculo não está registrada nesta base — pode ter ocorrido antes de " + competenciaLabelFromIdx(GLOBAL_MIN_IDX) + " ou não constar no CAGED disponibilizado.";
    } else if (v.status === "aberto") {
      note = "Não há desligamento registrado para este vínculo até " + competenciaLabelFromIdx(GLOBAL_MAX_IDX) + " — a pessoa pode seguir empregada nesta empresa, ou o desligamento simplesmente não consta na base.";
    }

    var html = '<div class="modal-overlay" data-action="close-modal-overlay">';
    html += '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">';
    html += '<div class="modal-head"><div><div class="modal-eyebrow">Detalhes do vínculo</div><h3 id="modal-title">' + esc(titleCasePt(p.nome)) + '</h3>' +
      '<div class="person-meta" style="margin-top:6px"><span class="mono">CPF ' + p.cpfFormatado + '</span><span class="sep">&middot;</span><span>CNPJ ' + v.cnpjRaiz + '</span>' +
      (v.secao ? '<span class="sep">&middot;</span><span>' + esc(titleCasePt(v.secao)) + "</span>" : "") + "</div></div>" +
      '<button class="modal-close" data-action="close-modal" aria-label="Fechar">' + ICONS.x + "</button></div>";

    html += '<div class="modal-body">';
    if (note) html += '<div class="note-box">' + ICONS.info + '<span>' + esc(note) + "</span></div>";
    if (v.duracaoMeses !== null) html += '<div class="note-box"><strong style="color:var(--ink)">Duração do vínculo: ' + monthsToText(v.duracaoMeses) + "</strong></div>";
    if (v.subclasse) html += '<div class="note-box" style="background:transparent;padding-left:0"><span><strong style="color:var(--ink-2)">Atividade econômica detalhada:</strong> ' + esc(titleCasePt(v.subclasse)) + "</span></div>";

    html += recordCard("Admissão", admOcc);
    html += recordCard("Desligamento", desOcc);

    html += '<details class="meta-accordion"><summary>Dados do convênio / programa (constantes em toda a base)</summary><div class="field-grid">' +
      field("SEI", metaSrc.sei) + field("Termo (TransfereGov)", metaSrc.transferegovNumero + "/" + metaSrc.transferegovAno) +
      field("Modalidade", titleCasePt(metaSrc.modalidade)) + field("Instituição", titleCasePt(metaSrc.instituicao)) +
      field("Situação do convênio", titleCasePt(metaSrc.status)) + field("Local do curso", titleCasePt(metaSrc.localCurso)) +
      field("Responsável", titleCasePt(metaSrc.responsavel)) + field("CPF do responsável", metaSrc.cpfResponsavel) +
      field("Cargo do responsável", titleCasePt(metaSrc.cargoResponsavel)) + field("Aprovado na certificação", metaSrc.aprovado) +
      "</div></details>";

    html += "</div></div></div>";
    return html;
  }

  function recordCard(title, o) {
    if (!o) {
      return '<div class="record-card"><div class="record-card-head">' + title + '</div><div style="padding:14px;color:var(--ink-muted);font-size:13px">Não registrado nesta base.</div></div>';
    }
    return '<div class="record-card"><div class="record-card-head">' + title +
      (o.duplicado ? '<span class="badge badge-warning">Registro duplicado na planilha</span>' : "") +
      "</div>" +
      '<div class="field-grid">' +
      field("Competência", o.competenciaLabel) +
      field("Tipo de movimentação", titleCasePt(o.tipoMovimentacao)) +
      field("Setor (CAGED_CO_SECAO)", titleCasePt(o.secao)) +
      field("Atividade / subclasse (CAGED_CO_SUBCLASSE)", titleCasePt(o.subclasse)) +
      field("Curso vinculado", titleCasePt(o.curso)) +
      field("Turma", o.turma) +
      field("Cidade / UF", titleCasePt(o.municipio) + " / " + o.uf) +
      field("Ano-base", o.anoBase) +
      field("CadÚnico ativo", o.cadUnicoAtivo === "SIM" ? "Sim" : "Não") +
      "</div></div>";
  }
  function field(label, value) {
    return '<div class="field"><div class="field-label">' + esc(label) + '</div><div class="field-value">' + esc(value === undefined || value === null || value === "" ? "—" : value) + "</div></div>";
  }

  /* ================= EVENTS ================= */
  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action;
    switch (action) {
      case "go-overview":
        state.view = "overview"; state.selectedCpf = null; state.modal = null; render(); break;
      case "open-pessoa":
        state.view = "pessoa"; state.selectedCpf = el.dataset.cpf; window.scrollTo(0, 0); render(); break;
      case "sort":
        if (state.sort.field === el.dataset.field) state.sort.dir = state.sort.dir === "asc" ? "desc" : "asc";
        else { state.sort.field = el.dataset.field; state.sort.dir = "asc"; }
        render(); break;
      case "page-goto":
        var pg = parseInt(el.dataset.page, 10);
        if (pg >= 1) { state.page = pg; render(); }
        break;
      case "toggle-filters":
        state.filtersExpanded = !state.filtersExpanded; render(); break;
      case "clear-all":
        state.search = "";
        state.filters = { periodoStart: null, periodoEnd: null, uf: new Set(), municipio: new Set(), secao: new Set(), cnpjRaizFiltro: new Set(), curso: new Set(), tipoMovimentacao: new Set(), situacaoCaged: "todas", cadUnico: "todas" };
        state.page = 1; render(); break;
      case "remove-filter":
        if (el.dataset.dim === "periodo") { state.filters.periodoStart = null; state.filters.periodoEnd = null; }
        else if (el.dataset.dim === "situacaoCaged") { state.filters.situacaoCaged = "todas"; }
        else if (el.dataset.dim === "cadUnico") { state.filters.cadUnico = "todas"; }
        else state.filters[el.dataset.dim].delete(el.dataset.value);
        state.page = 1; render(); break;
      case "ms-toggle":
        state.openMsFilter = state.openMsFilter === el.dataset.dim ? null : el.dataset.dim; render(); break;
      case "open-vinculo":
        state.modal = { type: "vinculo", id: parseInt(el.dataset.id, 10) }; render(); break;
      case "close-modal":
        state.modal = null; render(); break;
      case "close-modal-overlay":
        if (e.target === el) { state.modal = null; render(); }
        break;
    }
  });

  app.addEventListener("input", function (e) {
    if (e.target.dataset.role === "search") {
      state.search = e.target.value; state.page = 1;
      renderTableRegionOnly();
    }
  });

  app.addEventListener("change", function (e) {
    var role = e.target.dataset.role;
    if (role === "periodo-start") { state.filters.periodoStart = e.target.value ? parseInt(e.target.value, 10) : null; state.page = 1; render(); }
    else if (role === "periodo-end") { state.filters.periodoEnd = e.target.value ? parseInt(e.target.value, 10) : null; state.page = 1; render(); }
    else if (role === "pagesize") { state.pageSize = parseInt(e.target.value, 10); state.page = 1; render(); }
    else if (role === "situacao-caged") { state.filters.situacaoCaged = e.target.value; state.page = 1; render(); }
    else if (role === "cadunico") { state.filters.cadUnico = e.target.value; state.page = 1; render(); }
    else if (role === "ms-option") {
      var dim = e.target.dataset.dim, val = e.target.value;
      if (e.target.checked) state.filters[dim].add(val); else state.filters[dim].delete(val);
      state.page = 1; render();
    }
  });

  // lightweight re-render for the search box that preserves input focus/caret
  function renderTableRegionOnly() {
    render();
    var input = app.querySelector('[data-role="search"]');
    if (input) {
      input.focus();
      var len = input.value.length;
      input.setSelectionRange(len, len);
    }
  }

  document.addEventListener("click", function (e) {
    if (state.openMsFilter && !e.target.closest('.filter-field[data-dim="' + state.openMsFilter + '"]')) {
      state.openMsFilter = null; render();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (state.modal) { state.modal = null; render(); }
      else if (state.openMsFilter) { state.openMsFilter = null; render(); }
    }
  });

  render();
})();

</script>
