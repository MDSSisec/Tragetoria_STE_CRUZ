<title>Trajetórias Santa Cruz</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --surface-2:   #f2f1ec;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-muted:   #898781;
    --line:        #e1e0d9;
    --line-strong: #c3c2b7;
    --accent:      #2a78d6;
    --accent-ink:  #ffffff;
    --accent-wash: #e8f0fb;
    --good:        #0ca30c;
    --good-wash:   #e6f5e6;
    --critical:    #d03b3b;
    --critical-wash: #fbe9e9;
    --warning:     #b07a00;
    --warning-wash: #fbf1dc;
    --shadow: 0 1px 2px rgba(11,11,11,0.04), 0 8px 24px -12px rgba(11,11,11,0.12);
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --font-display: "Libre Franklin", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface:     #1a1a19;
      --surface-2:   #232322;
      --ink:         #ffffff;
      --ink-2:       #c3c2b7;
      --ink-muted:   #918f88;
      --line:        #2c2c2a;
      --line-strong: #3a3a37;
      --accent:      #5b9ce8;
      --accent-ink:  #06172b;
      --accent-wash: #16283e;
      --good:        #29c229;
      --good-wash:   #103a10;
      --critical:    #e66767;
      --critical-wash: #3a1414;
      --warning:     #e0ac3d;
      --warning-wash: #3a2c0a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #232322;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --ink-muted:   #918f88;
    --line:        #2c2c2a;
    --line-strong: #3a3a37;
    --accent:      #5b9ce8;
    --accent-ink:  #06172b;
    --accent-wash: #16283e;
    --good:        #29c229;
    --good-wash:   #103a10;
    --critical:    #e66767;
    --critical-wash: #3a1414;
    --warning:     #e0ac3d;
    --warning-wash: #3a2c0a;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  button { font-family: inherit; }
  a { color: var(--accent); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .tabular { font-variant-numeric: tabular-nums; }

  ::selection { background: var(--accent-wash); }

  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- shell ---------- */
  .shell { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-mark svg { width: 16px; height: 16px; }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 16.5px; letter-spacing: -0.01em; }
  .brand-sub { color: var(--ink-muted); font-size: 12.5px; }

  main { flex: 1; }
  .container { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }

  /* ---------- kpi row ---------- */
  .kpi-row {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-lg);
    overflow: hidden; margin-bottom: 22px;
  }
  .kpi-tile { background: var(--surface); padding: 16px 18px; min-width: 0; }
  .kpi-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted);
    font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi-value { font-family: var(--font-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .kpi-sub { font-size: 11.5px; color: var(--ink-muted); margin-top: 3px; }
  @media (max-width: 900px) { .kpi-row { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }

  .scope-note {
    font-size: 12.5px; color: var(--ink-muted); margin: -12px 0 20px; display: flex; align-items: center; gap: 6px;
  }
  .scope-note strong { color: var(--ink-2); font-weight: 600; }
  .scope-note svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* ---------- panel / card ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }

  /* ---------- toolbar (filters) ---------- */
  .toolbar { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .search-row { display: flex; gap: 10px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: var(--radius);
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13.5px;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-muted); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-accent:hover { filter: brightness(1.05); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn svg { width: 14px; height: 14px; }
  .btn .count-pill {
    background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 11px; font-weight: 700;
    padding: 1px 6px; margin-left: 2px;
  }

  .filters-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px;
    padding-top: 4px; border-top: 1px solid var(--line);
  }
  .filter-field label {
    display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted);
    font-weight: 600; margin-bottom: 5px;
  }
  .filter-field select, .filter-field input[type="text"] {
    width: 100%; padding: 7px 8px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong);
    background: var(--surface-2); color: var(--ink); font-size: 13px;
  }
  .filter-field { position: relative; }
  .ms-trigger {
    width: 100%; text-align: left; padding: 7px 8px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong);
    background: var(--surface-2); color: var(--ink); font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px;
  }
  .ms-trigger span.ph { color: var(--ink-muted); }
  .ms-panel {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm); box-shadow: var(--shadow);
    max-height: 220px; overflow: auto; padding: 6px;
  }
  .ms-option { display: flex; align-items: center; gap: 7px; padding: 5px 6px; border-radius: 5px; font-size: 12.5px; cursor: pointer; }
  .ms-option:hover { background: var(--surface-2); }
  .ms-option input { margin: 0; }

  .active-filters { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; background: var(--accent-wash); color: var(--accent);
    border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px; font-weight: 600;
  }
  .chip button { background: none; border: none; color: inherit; cursor: pointer; display: flex; padding: 2px; border-radius: 50%; }
  .chip button:hover { background: rgba(0,0,0,0.08); }
  .chip svg { width: 11px; height: 11px; }

  /* ---------- drill-down panels ---------- */
  .drill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 860px) { .drill-grid { grid-template-columns: 1fr; } }

  .drill-panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 20px 22px 26px;
  }
  .drill-panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 2px; }
  .drill-panel-head h2 { font-size: 16px; }
  .drill-total { font-size: 12px; color: var(--ink-muted); }

  .drill-breadcrumb { display: flex; align-items: center; gap: 2px; margin: 10px 0 18px; flex-wrap: wrap; }
  .drill-crumb {
    background: none; border: none; padding: 3px 7px; border-radius: 6px; font-size: 12.5px;
    color: var(--ink-muted); cursor: pointer; font-weight: 600;
  }
  .drill-crumb:hover:not(.current) { background: var(--surface-2); color: var(--ink-2); }
  .drill-crumb.current { color: var(--ink); cursor: default; }
  .drill-sep { color: var(--line-strong); display: flex; align-items: center; }
  .drill-sep svg { width: 10px; height: 10px; }

  .chart-empty { padding: 40px 12px; text-align: center; color: var(--ink-muted); font-size: 13px; }
  .chart-hint { margin-top: 12px; font-size: 11.5px; color: var(--ink-muted); text-align: center; }

  .bar-chart-vertical { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding-top: 10px; }
  .bar-chart-months { gap: 5px; }
  .bar-col {
    flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    height: 100%; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit;
  }
  .bar-col:disabled { cursor: default; }
  .bar-value { font-size: 11px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-shape { width: 100%; max-width: 46px; border-radius: 5px 5px 2px 2px; min-height: 2px; opacity: 0.92; transition: opacity .12s; }
  .bar-col:hover:not(:disabled) .bar-shape { opacity: 0.7; }
  .bar-label { margin-top: 8px; font-size: 11.5px; color: var(--ink-muted); font-weight: 600; }

  .bar-chart-horizontal { display: flex; flex-direction: column; gap: 6px; }
  .bar-row {
    display: grid; grid-template-columns: 152px 1fr 38px; align-items: center; gap: 10px;
    width: 100%; background: none; border: none; padding: 4px 6px; margin: 0 -6px; border-radius: 6px;
    font: inherit; color: inherit; text-align: inherit;
  }
  button.bar-row { cursor: pointer; }
  button.bar-row:hover { background: var(--surface-2); }
  .bar-row-static { cursor: default; }
  .bar-row-label { font-size: 12.5px; color: var(--ink-2); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row-track { background: var(--surface-2); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-row-fill { height: 100%; border-radius: 4px; min-width: 3px; opacity: 0.92; }
  .bar-row-value { font-size: 12px; color: var(--ink-muted); }
  @media (max-width: 520px) { .bar-row { grid-template-columns: 96px 1fr 34px; } .bar-row-label { font-size: 11.5px; } }

  footer.app-footer { text-align: center; padding: 28px 24px 40px; color: var(--ink-muted); font-size: 12px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<script>
(function () {
  "use strict";

  /* ================= DATA ================= */

  var pessoas = RAW.pessoas;

  var opcoes = RAW.opcoes;
  var indicadoresBase = RAW.indicadores;

  var pessoaById = new Map(pessoas.map(function (p) { return [p.id, p]; }));

  var COMPETENCIA_IDXS = Array.from(new Set(ocorrencias.map(function (o) { return o.competenciaIdx; }))).sort(function (a, b) { return a - b; });

  /* ================= HELPERS ================= */
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var LOWER_WORDS = new Set(["de", "da", "do", "dos", "das", "e", "em", "para", "com", "a", "o"]);
  function titleCasePt(s) {
    if (!s) return "";
    return String(s).toLowerCase().split(" ").map(function (w, i) {
      if (!w) return w;
      if (i > 0 && LOWER_WORDS.has(w)) return w;
      if (/^\d/.test(w)) return w;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(" ");
  }
  function fmtInt(n) { return n.toLocaleString("pt-BR"); }
  function competenciaLabelFromIdx(idx) {
    var ano = Math.floor((idx - 1) / 12);
    var mes = idx - ano * 12;
    return MESES[mes] + "/" + ano;
  }
  var ICONS = {
    filter: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h14M6 10h8M8.5 15h3" stroke-linecap="round"/></svg>',

  };

  // "pessoa" dims live on every person regardless of whether they ever had a CAGED occurrence

  var FILTER_DIMS = [
    { key: "uf", label: "UF", options: opcoes.ufs, level: "pessoa" },
    { key: "municipio", label: "Cidade", options: opcoes.municipios, titleCase: true, level: "pessoa" },
    { key: "curso", label: "Curso / formação", options: opcoes.cursos, titleCase: true, level: "pessoa" },
    { key: "secao", label: "Área / setor", options: opcoes.secoes, titleCase: true, level: "ocorrencia" },
    { key: "cnpjRaizFiltro", label: "Empresa (CNPJ raiz)", options: opcoes.cnpjRaizes, level: "ocorrencia" },
    { key: "tipoMovimentacao", label: "Tipo de movimentação", options: opcoes.tiposMovimentacao, titleCase: true, level: "ocorrencia" }
  ];
  var OCC_DIMS = FILTER_DIMS.filter(function (d) { return d.level === "ocorrencia"; });
  var PESSOA_DIMS = FILTER_DIMS.filter(function (d) { return d.level === "pessoa"; });

  /* ================= STATE ================= */
  var state = {

  function filterKeyForOcc(dim, o) { return dim === "cnpjRaizFiltro" ? o.cnpjRaiz : o[dim]; }

  // matches a real CAGED occurrence against período + the occurrence-level dims
  function occMatchesOccLevelFilters(o) {
    var f = state.filters;
    if (f.periodoStart !== null && o.competenciaIdx < f.periodoStart) return false;

  // matches a person against pessoa-level dims + the "situação no CAGED" / "CadÚnico" toggles

  }
  function hasActiveFilters() {
    var f = state.filters;
    if (f.periodoStart !== null || f.periodoEnd !== null) return true;
    if (f.situacaoCaged !== "todas") return true;
    if (f.cadUnico !== "todas") return true;
    return FILTER_DIMS.some(function (d) { return f[d.key].size > 0; });
  }
  function activeFilterCount() {
    var f = state.filters;
    var n = FILTER_DIMS.reduce(function (acc, d) { return acc + f[d.key].size; }, 0);
    if (f.periodoStart !== null || f.periodoEnd !== null) n += 1;

  function getVisibleScope() {

      return true;
    });
    var scopeIds = new Set(list.map(function (p) { return p.id; }));
    var filteredOcc = ocorrencias.filter(function (o) { return scopeIds.has(o.pessoaId) && occMatchesOccLevelFilters(o); });
    return { pessoasInScope: list, filteredOcc: filteredOcc };
  }

  /* ================= RENDER: SHELL ================= */
  var app = document.getElementById("app");

  function render() {
    var html = renderTopbar() + '<main>' + renderDashboard() + "</main>" + renderFooter();
    app.innerHTML = html;
  }

  function renderTopbar() {
    return '' +
      '<div class="topbar"><div class="topbar-inner">' +
      '<div class="brand">' +
      '<div class="brand-mark"><svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 15l4.2-5 3.4 3L16.5 6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 6H16.5V10" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
      '<div><div class="brand-name">Trajetórias Santa Cruz</div><div class="brand-sub">Admissões e desligamentos &middot; egressos dos cursos profissionalizantes cruzados com o CAGED</div></div>' +
      '</div>' +
      '</div></div>';
  }

  function renderFooter() {
    return '<footer class="app-footer">Base: Associação União Santa Cruz &middot; ocorrências CAGED ' +
      competenciaLabelFromIdx(GLOBAL_MIN_IDX) + '–' + competenciaLabelFromIdx(GLOBAL_MAX_IDX) +
      ' &middot; ' + fmtInt(ocorrencias.length) + ' registros originais, nenhum descartado &middot; ' +
      'apenas dados agregados são exibidos — nenhum nome ou CPF individual aparece neste painel.</footer>';
  }

  /* ================= RENDER: DASHBOARD ================= */
  function renderDashboard() {
    var scope = getVisibleScope();
    var kpis = computeKpis(scope.filteredOcc);

    var totalPessoasScope = scope.pessoasInScope.length;
    var comOcorrencia = scope.pessoasInScope.filter(function (p) { return p.temOcorrencia; }).length;
    var pctComOcorrencia = totalPessoasScope ? Math.round((comOcorrencia / totalPessoasScope) * 100) : 0;

    var kpiDefs = [
      ["Pessoas", totalPessoasScope, comOcorrencia + " com vínculo encontrado (" + pctComOcorrencia + "%)"],
      ["Ocorrências", kpis.totalOcorrencias],
      ["Admissões", kpis.totalAdmissoes],
      ["Desligamentos", kpis.totalDesligamentos],
      ["Empresas", kpis.totalEmpresas],
      ["Áreas de atuação", kpis.totalAreas]
    ];
    var kpiHtml = kpiDefs.map(function (k) {
      return '<div class="kpi-tile"><div class="kpi-label">' + k[0] + '</div><div class="kpi-value tabular">' + fmtInt(k[1]) + "</div>" +
        (k[2] ? '<div class="kpi-sub">' + k[2] + "</div>" : "") + "</div>";
    }).join("");

    return '' +
      '<div class="container">' +
      '<div class="kpi-row">' + kpiHtml + "</div>" +
      (hasActiveFilters()
        ? '<div class="scope-note">' + ICONS.info + ' Indicadores e gráficos calculados sobre <strong>o recorte filtrado</strong>.</div>'
        : '<div class="scope-note">' + ICONS.info + " Indicadores sobre a base completa: " + fmtInt(indicadoresBase.totalPessoas) + " pessoas cruzadas com o CAGED, das quais " + fmtInt(indicadoresBase.totalPessoasComOcorrencia) + " tiveram algum vínculo encontrado. Use os filtros para recortar por período, local, setor, empresa, curso, tipo de movimentação, situação no CAGED ou CadÚnico.</div>") +
      '<div class="panel">' + renderToolbar() + "</div>" +
      '<div class="drill-grid">' + renderDrillPanel("admissao", scope) + renderDrillPanel("desligamento", scope) + "</div>" +
      "</div>";
  }

  function renderToolbar() {
    var html = '<div class="toolbar">';
    html += '<div class="search-row">';
    html += '<button class="btn' + (state.filtersExpanded ? " btn-accent" : "") + '" data-action="toggle-filters">' + ICONS.filter + " Filtros" + (activeFilterCount() ? '<span class="count-pill">' + activeFilterCount() + "</span>" : "") + "</button>";
    if (hasActiveFilters()) html += '<button class="btn btn-ghost" data-action="clear-all">Limpar tudo</button>';
    html += "</div>";

    if (state.filtersExpanded) {
      html += '<div class="filters-grid">';
      html += renderPeriodoFilter();
      html += renderSituacaoCagedFilter();
      html += renderCadUnicoFilter();
      FILTER_DIMS.forEach(function (d) { html += renderMsFilter(d); });
      html += "</div>";
    }

    var chips = renderActiveChips();
    if (chips) html += '<div class="active-filters">' + chips + "</div>";
    html += "</div>";
    return html;
  }

  function renderPeriodoFilter() {
    function opts(selected) {
      return '<option value="">—</option>' + COMPETENCIA_IDXS.map(function (idx) {
        return '<option value="' + idx + '"' + (selected === idx ? " selected" : "") + '>' + competenciaLabelFromIdx(idx) + "</option>";
      }).join("");
    }
    return '' +
      '<div class="filter-field"><label>Período — de</label><select data-role="periodo-start">' + opts(state.filters.periodoStart) + '</select></div>' +
      '<div class="filter-field"><label>Período — até</label><select data-role="periodo-end">' + opts(state.filters.periodoEnd) + '</select></div>';
  }

  function renderSituacaoCagedFilter() {
    var v = state.filters.situacaoCaged;
    function opt(val, label) { return '<option value="' + val + '"' + (v === val ? " selected" : "") + ">" + label + "</option>"; }
    return '<div class="filter-field"><label>Situação no CAGED</label><select data-role="situacao-caged">' +
      opt("todas", "Todas") + opt("com", "Com vínculo encontrado") + opt("sem", "Sem vínculo encontrado") +
      "</select></div>";
  }

  function renderCadUnicoFilter() {
    var v = state.filters.cadUnico;
    function opt(val, label) { return '<option value="' + val + '"' + (v === val ? " selected" : "") + ">" + label + "</option>"; }
    return '<div class="filter-field"><label>CadÚnico</label><select data-role="cadunico">' +
      opt("todas", "Todas") + opt("sim", "CadÚnico ativo") + opt("nao", "CadÚnico não ativo") +
      "</select></div>";
  }

  function renderMsFilter(dim) {
    var set = state.filters[dim.key];
    var isOpen = state.openMsFilter === dim.key;
    var triggerText = set.size === 0 ? '<span class="ph">Todas</span>' : set.size + " selecionada" + (set.size > 1 ? "s" : "");
    var html = '<div class="filter-field" data-dim="' + dim.key + '"><label>' + esc(dim.label) + "</label>";
    html += '<button type="button" class="ms-trigger" data-action="ms-toggle" data-dim="' + dim.key + '">' + triggerText + '<span style="opacity:.5">▾</span></button>';
    if (isOpen) {
      html += '<div class="ms-panel">';
      html += dim.options.map(function (opt) {
        var checked = set.has(opt);
        var label = dim.titleCase ? titleCasePt(opt) : opt;
        return '<label class="ms-option"><input type="checkbox" data-role="ms-option" data-dim="' + dim.key + '" value="' + esc(opt) + '" ' + (checked ? "checked" : "") + " /> " + esc(label) + "</label>";
      }).join("");
      html += "</div>";
    }
    html += "</div>";
    return html;
  }

  function renderActiveChips() {
    var chips = [];
    var f = state.filters;
    if (f.periodoStart !== null || f.periodoEnd !== null) {
      var txt = (f.periodoStart !== null ? competenciaLabelFromIdx(f.periodoStart) : "início") + " – " + (f.periodoEnd !== null ? competenciaLabelFromIdx(f.periodoEnd) : "fim");
      chips.push(chipHtml("Período: " + txt, "periodo", ""));
    }
    if (f.situacaoCaged !== "todas") {
      chips.push(chipHtml("Situação no CAGED: " + (f.situacaoCaged === "com" ? "com vínculo encontrado" : "sem vínculo encontrado"), "situacaoCaged", ""));
    }
    if (f.cadUnico !== "todas") {
      chips.push(chipHtml("CadÚnico: " + (f.cadUnico === "sim" ? "ativo" : "não ativo"), "cadUnico", ""));
    }
    FILTER_DIMS.forEach(function (d) {
      f[d.key].forEach(function (v) {
        var label = d.titleCase ? titleCasePt(v) : v;
        chips.push(chipHtml(d.label + ": " + label, d.key, v));
      });
    });
    return chips.join("");
  }
  function chipHtml(text, dim, value) {
    return '<span class="chip">' + esc(text) + '<button type="button" data-action="remove-filter" data-dim="' + dim + '" data-value="' + esc(value) + '">' + ICONS.x + "</button></span>";
  }

  /* ================= RENDER: DRILL-DOWN PANELS ================= */
  var PANEL_META = {
    admissao: { title: "Admissões", colorVar: "--good", emptyMsg: "Nenhuma admissão encontrada com os filtros atuais." },
    desligamento: { title: "Desligamentos", colorVar: "--critical", emptyMsg: "Nenhum desligamento encontrado com os filtros atuais." }
  };

  function renderDrillPanel(kind, scope) {
    var meta = PANEL_META[kind];
    var occ = scope.filteredOcc.filter(function (o) { return o.movimento === kind; });
    var st = state.drill[kind];

    var bodyHtml;
    if (!occ.length) {
      bodyHtml = '<div class="chart-empty">' + meta.emptyMsg + "</div>";
    } else if (st.level === "ano") {
      bodyHtml = renderAnoChart(occ, kind);
    } else if (st.level === "mes") {
      bodyHtml = renderMesChart(occ, kind, st.ano);
    } else if (st.level === "setor") {
      bodyHtml = renderSetorChart(occ, kind, st.ano, st.mes);
    } else {
      bodyHtml = renderSubclasseChart(occ, kind, st.ano, st.mes, st.secao);
    }

    return '' +
      '<div class="drill-panel">' +
      '<div class="drill-panel-head"><h2>' + meta.title + "</h2><span class=\"drill-total\">" + fmtInt(occ.length) + " ocorrências no recorte atual</span></div>" +
      renderDrillBreadcrumb(kind, st) +
      bodyHtml +
      "</div>";
  }

  function truncateLabel(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  function sepHtml() { return '<span class="drill-sep">' + ICONS.chevronRight + "</span>"; }

  function renderDrillBreadcrumb(kind, st) {
    var parts = [];
    parts.push('<button type="button" class="drill-crumb' + (st.level === "ano" ? " current" : "") + '" data-action="drill-reset" data-kind="' + kind + '">Todos os anos</button>');
    if (st.level !== "ano") {
      parts.push(sepHtml());
      parts.push('<button type="button" class="drill-crumb' + (st.level === "mes" ? " current" : "") + '" data-action="drill-ano" data-kind="' + kind + '" data-ano="' + st.ano + '">' + st.ano + "</button>");
    }
    if (st.level === "setor" || st.level === "subclasse") {
      parts.push(sepHtml());
      parts.push('<button type="button" class="drill-crumb' + (st.level === "setor" ? " current" : "") + '" data-action="drill-mes" data-kind="' + kind + '" data-mes="' + st.mes + '">' + MESES[st.mes] + "</button>");
    }
    if (st.level === "subclasse") {
      parts.push(sepHtml());
      var label = st.secao === "__NULL__" ? "Não informado" : titleCasePt(st.secao);
      parts.push('<span class="drill-crumb current" title="' + esc(label) + '">' + esc(truncateLabel(label, 34)) + "</span>");
    }
    return '<div class="drill-breadcrumb">' + parts.join("") + "</div>";
  }

  function renderAnoChart(occ, kind) {
    var color = PANEL_META[kind].colorVar;
    var counts = new Map();
    opcoes.anos.forEach(function (a) { counts.set(a, 0); });
    occ.forEach(function (o) { counts.set(o.ano, (counts.get(o.ano) || 0) + 1); });
    var max = Math.max.apply(null, Array.from(counts.values()).concat([1]));
    var bars = opcoes.anos.map(function (ano) {
      var v = counts.get(ano) || 0;
      var h = max ? Math.round((v / max) * 100) : 0;
      return '<button type="button" class="bar-col" data-action="drill-ano" data-kind="' + kind + '" data-ano="' + ano + '" ' + (v === 0 ? "disabled" : "") + ' aria-label="' + ano + ": " + v + ' ocorrências">' +
        '<span class="bar-value">' + (v ? fmtInt(v) : "") + "</span>" +
        '<span class="bar-shape" style="height:' + Math.max(h, v ? 4 : 0) + "%;background:var(" + color + ')"></span>' +
        '<span class="bar-label">' + ano + "</span>" +
        "</button>";
    }).join("");
    return '<div class="bar-chart bar-chart-vertical">' + bars + "</div>" +
      '<div class="chart-hint">Clique em um ano para ver os meses.</div>';
  }

  function renderMesChart(occ, kind, ano) {
    var color = PANEL_META[kind].colorVar;
    var occAno = occ.filter(function (o) { return o.ano === ano; });
    var counts = new Map();
    for (var m = 1; m <= 12; m++) counts.set(m, 0);
    occAno.forEach(function (o) { counts.set(o.mes, (counts.get(o.mes) || 0) + 1); });
    var max = Math.max.apply(null, Array.from(counts.values()).concat([1]));
    var bars = [];
    for (var mes = 1; mes <= 12; mes++) {
      var v = counts.get(mes) || 0;
      var h = max ? Math.round((v / max) * 100) : 0;
      bars.push('<button type="button" class="bar-col" data-action="drill-mes" data-kind="' + kind + '" data-mes="' + mes + '" ' + (v === 0 ? "disabled" : "") + ' aria-label="' + MESES[mes] + "/" + ano + ": " + v + ' ocorrências">' +
        '<span class="bar-value">' + (v ? fmtInt(v) : "") + "</span>" +
        '<span class="bar-shape" style="height:' + Math.max(h, v ? 4 : 0) + "%;background:var(" + color + ')"></span>' +
        '<span class="bar-label">' + MESES[mes] + "</span>" +
        "</button>");
    }
    if (!occAno.length) return '<div class="chart-empty">Nenhuma ocorrência em ' + ano + " com os filtros atuais.</div>";
    return '<div class="bar-chart bar-chart-vertical bar-chart-months">' + bars.join("") + "</div>" +
      '<div class="chart-hint">Clique em um mês para ver os setores.</div>';
  }

  function renderSetorChart(occ, kind, ano, mes) {
    var color = PANEL_META[kind].colorVar;
    var occSel = occ.filter(function (o) { return o.ano === ano && o.mes === mes; });
    if (!occSel.length) return '<div class="chart-empty">Nenhuma ocorrência em ' + MESES[mes] + "/" + ano + " com os filtros atuais.</div>";
    var counts = new Map();
    occSel.forEach(function (o) {
      var key = o.secao || "__NULL__";
      counts.set(key, (counts.get(key) || 0) + 1);
    });
    var entries = Array.from(counts.entries()).sort(function (a, b) { return b[1] - a[1]; });
    var max = entries.length ? entries[0][1] : 1;
    var rows = entries.map(function (e) {
      var rawKey = e[0];
      var label = rawKey === "__NULL__" ? "Não informado" : titleCasePt(rawKey);
      var pct = Math.max(3, Math.round((e[1] / max) * 100));
      return '<button type="button" class="bar-row" data-action="drill-setor" data-kind="' + kind + '" data-secao="' + esc(rawKey) + '" title="' + esc(label) + ": " + e[1] + '">' +
        '<div class="bar-row-label">' + esc(label) + "</div>" +
        '<div class="bar-row-track"><div class="bar-row-fill" style="width:' + pct + "%;background:var(" + color + ')"></div></div>' +
        '<div class="bar-row-value tabular">' + fmtInt(e[1]) + "</div>" +
        "</button>";
    }).join("");
    return '<div class="bar-chart bar-chart-horizontal">' + rows + "</div>" +
      '<div class="chart-hint">Clique em um setor para ver a atividade econômica detalhada (CAGED_CO_SUBCLASSE).</div>';
  }

  function renderSubclasseChart(occ, kind, ano, mes, secaoKey) {
    var color = PANEL_META[kind].colorVar;
    var occSel = occ.filter(function (o) {
      if (o.ano !== ano || o.mes !== mes) return false;
      if (secaoKey === "__NULL__") return !o.secao;
      return o.secao === secaoKey;
    });
    if (!occSel.length) return '<div class="chart-empty">Nenhuma ocorrência encontrada para este setor no período selecionado.</div>';
    var counts = new Map();
    occSel.forEach(function (o) {
      var key = o.subclasse || "Não informado";
      counts.set(key, (counts.get(key) || 0) + 1);
    });
    var entries = Array.from(counts.entries()).sort(function (a, b) { return b[1] - a[1]; });
    var max = entries.length ? entries[0][1] : 1;
    var rows = entries.map(function (e) {
      var label = e[0] === "Não informado" ? e[0] : titleCasePt(e[0]);
      var pct = Math.max(3, Math.round((e[1] / max) * 100));
      return '<div class="bar-row bar-row-static" title="' + esc(label) + ": " + e[1] + '">' +
        '<div class="bar-row-label">' + esc(label) + "</div>" +
        '<div class="bar-row-track"><div class="bar-row-fill" style="width:' + pct + "%;background:var(" + color + ')"></div></div>' +
        '<div class="bar-row-value tabular">' + fmtInt(e[1]) + "</div>" +
        "</div>";
    }).join("");
    return '<div class="bar-chart bar-chart-horizontal">' + rows + "</div>";
  }

  /* ================= EVENTS ================= */
  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action;
    switch (action) {
      case "toggle-filters":
        state.filtersExpanded = !state.filtersExpanded; render(); break;
      case "clear-all":
        state.filters = { periodoStart: null, periodoEnd: null, uf: new Set(), municipio: new Set(), secao: new Set(), cnpjRaizFiltro: new Set(), curso: new Set(), tipoMovimentacao: new Set(), situacaoCaged: "todas", cadUnico: "todas" };
        render(); break;
      case "remove-filter":
        if (el.dataset.dim === "periodo") { state.filters.periodoStart = null; state.filters.periodoEnd = null; }
        else if (el.dataset.dim === "situacaoCaged") { state.filters.situacaoCaged = "todas"; }
        else if (el.dataset.dim === "cadUnico") { state.filters.cadUnico = "todas"; }
        else state.filters[el.dataset.dim].delete(el.dataset.value);
        render(); break;
      case "ms-toggle":
        state.openMsFilter = state.openMsFilter === el.dataset.dim ? null : el.dataset.dim; render(); break;
      case "drill-ano":
        state.drill[el.dataset.kind] = { level: "mes", ano: parseInt(el.dataset.ano, 10), mes: null, secao: null }; render(); break;
      case "drill-mes":
        state.drill[el.dataset.kind] = { level: "setor", ano: state.drill[el.dataset.kind].ano, mes: parseInt(el.dataset.mes, 10), secao: null };
        render(); break;
      case "drill-setor":
        state.drill[el.dataset.kind] = { level: "subclasse", ano: state.drill[el.dataset.kind].ano, mes: state.drill[el.dataset.kind].mes, secao: el.dataset.secao };
        render(); break;
      case "drill-reset":
        state.drill[el.dataset.kind] = { level: "ano", ano: null, mes: null, secao: null }; render(); break;
    }
  });

  app.addEventListener("change", function (e) {
    var role = e.target.dataset.role;
    if (role === "periodo-start") { state.filters.periodoStart = e.target.value ? parseInt(e.target.value, 10) : null; render(); }
    else if (role === "periodo-end") { state.filters.periodoEnd = e.target.value ? parseInt(e.target.value, 10) : null; render(); }
    else if (role === "situacao-caged") { state.filters.situacaoCaged = e.target.value; render(); }
    else if (role === "cadunico") { state.filters.cadUnico = e.target.value; render(); }
    else if (role === "ms-option") {
      var dim = e.target.dataset.dim, val = e.target.value;
      if (e.target.checked) state.filters[dim].add(val); else state.filters[dim].delete(val);
      render();
    }
  });

  document.addEventListener("click", function (e) {
    if (state.openMsFilter && !e.target.closest('.filter-field[data-dim="' + state.openMsFilter + '"]')) {
      state.openMsFilter = null; render();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.openMsFilter) { state.openMsFilter = null; render(); }
  });

  render();
})();

</script>
